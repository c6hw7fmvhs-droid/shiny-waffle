<html lang="ko">
<head>

  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');
:root{--paper:#f1eadf;--paper2:#faf7f0;--ink:#24201d;--muted:#8d8176;--red:#a93632;--red2:#c45a51;--blue:#477d91;--green:#729579;--yellow:#d2b84c;--purple:#9079a0;--line:#d9cfc1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e7dfd4;color:var(--ink);font-family:'Noto Sans KR',sans-serif}
body{padding:0}.app-shell{width:100%;max-width:480px;min-height:100dvh;margin:auto;background:var(--paper2);position:relative;box-shadow:0 0 40px #00000012;overflow:hidden}.status{height:34px;padding:8px 22px 0;display:flex;justify-content:space-between;font:600 12px 'DM Sans';background:var(--paper2)}

.onboarding{min-height:calc(100dvh - 34px);padding:32px 24px 28px;background-color:var(--paper);background-image:radial-gradient(#b5a99955 .7px,transparent .7px);background-size:7px 7px;text-align:center;display:flex;flex-direction:column;align-items:center}
.eyebrow,.kicker{font:700 10px 'DM Sans';letter-spacing:2.4px;color:var(--red)}h1{font:600 clamp(54px,16vw,76px)/.85 'Playfair Display';letter-spacing:-2px;color:var(--red);margin:24px 0 14px}h1 i{font-weight:500}.intro{font-size:13px;line-height:1.8;margin:8px 0 12px;color:#594f48}
.route-art{width:100%;max-width:340px;margin:0 auto 8px}.route-art svg{width:100%;height:auto}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.line.blue{stroke:#75a9b3}.line.green{stroke:#83a68a}.line.red{stroke:#b33f38;stroke-width:8}.line.yellow{stroke:#d5bd56}.nodes circle{fill:var(--paper);stroke:#82766a;stroke-width:2}
.form-card{width:100%;max-width:340px;text-align:left;background:#fbf8f1;border:1px solid #ded3c4;border-radius:15px;padding:17px 18px;box-shadow:0 5px 18px #5143330c}.form-card label{display:block;font:700 9px 'DM Sans';letter-spacing:1.5px;color:var(--muted);margin:0 0 6px}.form-card input{width:100%;border:0;border-bottom:1px solid #d8ccbd;background:transparent;padding:9px 2px 11px;margin-bottom:15px;font:14px 'Noto Sans KR';outline:none;color:var(--ink)}.primary{background:var(--red);color:#fff;border:0;border-radius:30px;padding:13px 18px;font:600 13px 'Noto Sans KR';box-shadow:0 4px 10px #a9363226}.primary span{float:right}.wide{width:100%;margin-top:5px}.fineprint{font:700 9px 'DM Sans';letter-spacing:2px;color:#9b8d7d;margin-top:17px}
.screen{padding:20px 20px 28px;min-height:calc(100dvh - 112px);background-color:var(--paper2);background-image:radial-gradient(#b5a99930 .6px,transparent .6px);background-size:8px 8px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.brand{font:600 20px 'Playfair Display';color:#653b34}.smallcaps{font:700 9px 'DM Sans';letter-spacing:1.8px;color:var(--red)}h2{font:500 36px/1.05 'Playfair Display';margin:4px 0 14px;color:#241d1a}h2.serif{font-size:32px}.muted{color:var(--muted)}.subcopy{font-size:12px;line-height:1.7;color:#85786d;margin:0 0 20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 11px;font:700 10px 'DM Sans';letter-spacing:1.5px;color:#65594f}.section-title span:last-child{color:var(--red)}
.hero{border:1px solid #d9cbbb;border-radius:15px;overflow:hidden;background:#e9dfd0;margin:15px 0}.hero-image{height:145px;background:linear-gradient(135deg,#d5c7b4,#eee7da);position:relative;overflow:hidden}.hero-image:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,#ffffff55 25.5%,transparent 26%),repeating-linear-gradient(0deg,transparent 0 35px,#ffffff38 36px 37px)}.hero-image svg{width:100%;height:100%}.hero-body{padding:14px 15px 16px}.day-pill{display:inline-block;background:var(--red);color:white;border-radius:20px;padding:5px 10px;font:700 9px 'DM Sans';letter-spacing:1px}.hero h3{font:600 23px 'Noto Sans KR';margin:10px 0 5px}.hero p{font-size:12px;color:#766a5f;line-height:1.7;margin:0}
.schedule{background:#fbf8f1;border:1px solid var(--line);border-radius:12px;padding:4px 13px}.schedule-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed #d9cfc1;font-size:12px}.schedule-row:last-child{border:0}.time{font:600 11px 'DM Sans';color:var(--red);width:43px}.notice{padding:13px;border-left:3px solid var(--red);background:#f5eee5;font-size:12px;line-height:1.7;color:#6e6258;border-radius:0 8px 8px 0}
.bottom-nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:76px;padding:8px 7px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#faf7f0f2;backdrop-filter:blur(12px);border-top:1px solid #ded4c7}.bottom-nav button{border:0;background:none;color:#8d8176;font:700 8px 'DM Sans';letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px}.bottom-nav button span{font:22px/1 'Noto Sans KR'}.bottom-nav button.active{color:var(--red)}
.cast-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.cast-card{border:1px solid #e0d6ca;border-radius:18px;overflow:hidden;background:#fffdfa;text-align:left;padding:0;cursor:pointer;box-shadow:0 2px 0 #e7ded3}.cast-photo{height:178px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.cast-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000005,transparent 65%,#00000010)}.cast-photo .initial{font:600 56px 'Playfair Display';color:#ffffffb5;text-shadow:0 2px 12px #ffffff50}.tag{position:absolute;z-index:1;top:12px;left:10px;background:#f8f2e9e8;padding:7px 10px;border-radius:20px;font-size:10px;color:#463a32}.cast-info{padding:12px 12px 14px}.cast-name{font-weight:700;font-size:16px}.cast-meta{font-size:11px;color:#958578;margin-top:5px}.cast-card:active{transform:scale(.985)}
.profile-cover{height:300px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;margin:12px 0 18px}.profile-cover .initial{font:100px 'Playfair Display';color:#ffffffa8}.back{border:0;background:none;padding:4px 8px 4px 0;font-size:13px;color:#77695d}.profile-name{font-size:30px;font-weight:700;margin:0}.profile-quote{font:italic 16px 'Playfair Display';color:#8b5148;margin:12px 0}.info-list{background:#fbf8f1;border:1px solid var(--line);border-radius:12px;padding:0 13px}.info-row{padding:12px 0;border-bottom:1px dashed #d9cfc1;font-size:12px;line-height:1.6}.info-row:last-child{border:0}.info-row b{display:inline-block;width:68px;color:var(--red)}
.chat-list{background:#fbf8f1;border:1px solid var(--line);border-radius:13px;overflow:hidden}.chat-person{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid #e9e0d5;width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left}.chat-person:last-child{border:0}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;color:#fff;font:22px 'Playfair Display';flex-shrink:0}.chat-main{flex:1;min-width:0}.chat-main b{font-size:13px}.chat-main p{font-size:11px;color:#8c8075;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time{font:10px 'DM Sans';color:#9a8e83}
.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:13px;border-bottom:1px solid var(--line)}.chat-head .avatar{width:38px;height:38px}.chat-messages{padding:15px 0;min-height:240px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:10px 12px;border-radius:13px;font-size:12px;line-height:1.6;background:#ebe3d8;align-self:flex-start}.bubble.mine{background:var(--red);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.bubble.theirs{border-bottom-left-radius:4px}.choice-list{display:grid;gap:8px;margin-top:8px}.choice{border:1px solid #bd7770;color:#8e3833;background:#fffaf4;border-radius:9px;padding:11px;font-size:12px;text-align:left}
.ticket{background:#f5e8c9;border:1px solid #d7c29a;padding:17px 15px;margin:17px 0;border-radius:5px;box-shadow:0 6px 15px #5b473018;position:relative}.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:18px;height:18px;background:var(--paper2);border-radius:50%;transform:translateY(-50%)}.ticket:before{left:-10px}.ticket:after{right:-10px}.ticket-top{display:flex;justify-content:space-between;font:700 9px 'DM Sans';letter-spacing:1px;color:#80534a;border-bottom:1px dashed #b9a47f;padding-bottom:10px}.ticket h3{font:600 26px 'Playfair Display';margin:18px 0 5px;color:#263f62}.ticket p{font-size:11px;color:#6f6252}.ticket-data{border-top:1px dashed #b9a47f;margin-top:13px;padding-top:10px;font-size:11px;line-height:2}.button-row{display:flex;gap:8px}.button-row button{flex:1}.secondary{border:1px solid #b98d80;background:transparent;color:#8e3833;border-radius:30px;padding:12px;font:600 12px 'Noto Sans KR'}
.map-card{border:1px solid var(--line);border-radius:14px;background:#f5f0e7;padding:10px;margin:15px 0}.map-card svg{width:100%;height:auto}.map-legend{display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:11px}.legend-item{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%}
.letter{background:#f6e8cb;border:1px solid #dfcda8;padding:24px 18px;margin:16px 0;box-shadow:0 5px 14px #54432b12;position:relative}.letter:before{content:"";position:absolute;left:50%;top:0;width:65px;height:32px;transform:translateX(-50%);background:#ead6b2;clip-path:polygon(0 0,100% 0,50% 100%)}.letter h3{text-align:center;font:600 22px 'Playfair Display';margin:14px 0}.letter p{text-align:center;font-size:12px;line-height:1.8;color:#766555}
.menu-list{border:1px solid var(--line);border-radius:12px;background:#fbf8f1;overflow:hidden}.menu-row{width:100%;padding:15px 13px;background:none;border:0;border-bottom:1px solid #e7ded2;text-align:left;display:flex;justify-content:space-between;font-size:12px}.menu-row:last-child{border:0}.day-control{display:flex;align-items:center;justify-content:space-between;background:#f6eee4;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:17px}.day-control b{font:600 14px 'DM Sans';color:var(--red)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#29211e;color:white;padding:10px 16px;border-radius:30px;font-size:11px;z-index:20;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(min-width:500px){body{padding:20px 0}.app-shell{min-height:calc(100dvh - 40px);border-radius:25px}.bottom-nav{bottom:20px;border-radius:0 0 25px 25px}.onboarding{min-height:calc(100dvh - 74px)}}

  </style>

<body>
  <div class="app-shell">
    <header class="status"><span>9:41</span><span>●●●　▰</span></header>
    <main id="app">
      <section id="onboarding" class="onboarding hidden">
        <div class="eyebrow">A REALITY LOVE PROGRAM</div>
        <h1>OUR<br><i>SEASON</i></h1>
        <p class="intro">이미 알고 있던 사이에서 시작되는<br>열흘간의 감정 기록</p>
        <div class="route-art" aria-hidden="true">
          <svg viewBox="0 0 320 210"><path d="M-5 35H70L105 70H190L225 35H325" class="line blue"/><path d="M-5 150H55L95 110H150L195 160H325" class="line green"/><path d="M60 -5V55L120 100L175 65L245 120L260 215" class="line red"/><path d="M320 85H255L220 120H130L90 180H-5" class="line yellow"/><g class="nodes"><circle cx="70" cy="35" r="5"/><circle cx="105" cy="70" r="5"/><circle cx="190" cy="70" r="5"/><circle cx="55" cy="150" r="5"/><circle cx="95" cy="110" r="5"/><circle cx="150" cy="110" r="5"/><circle cx="120" cy="100" r="5"/><circle cx="175" cy="65" r="5"/><circle cx="245" cy="120" r="5"/></g></svg>
        </div>

          <label for="userName">YOUR NAME</label><input id="userName" maxlength="12" placeholder="이름을 입력해 주세요">
          <label for="userAge">AGE</label><input id="userAge" type="number" min="18" max="99" placeholder="나이를 입력해 주세요">
          <button class="primary wide" id="enterBtn">참가하기 <span>→</span></button>
        </div>

      </section>
      <section id="mainApp" class="hidden">
        <div id="screen"></div>
        <nav class="bottom-nav">
          <button data-tab="home" class="active"><span>⌂</span>HOME</button>
          <button data-tab="cast"><span>♙</span>CAST</button>
          <button data-tab="chat"><span>◌</span>CHAT</button>
          <button data-tab="date"><span>♡</span>DATE</button>
          <button data-tab="my"><span>♧</span>MY</button>
        </nav>
      </section>
    </main>
  </div>
  <script>
const people = [
 {id:'jiwoo',name:'이지우',age:24,tag:'분위기를 읽는 사람',trait:'세심함',color:'#aaa99f',line:'#b74743',initial:'지',quote:'사람을 오래 지켜보는 편이에요.',personality:'차분하고 세심하며 상대의 작은 변화를 잘 알아차린다.',like:'조용한 카페, 오래된 영화, 산책',dislike:'부담스러운 관심, 성급한 판단',relation:'이미 알고 지낸 사이. 예전보다 조금 어색해진 순간이 있다.',first:'오늘은 조금 늦게까지 깨어 있을 것 같아요.'},
 {id:'yuryeon',name:'김유연',age:25,tag:'솔직한 현실주의자',trait:'솔직함',color:'#c99189',line:'#d2b84c',initial:'유',quote:'좋으면 좋다고 말하는 편이에요.',personality:'밝고 솔직하다. 감정을 숨기기보다 대화로 풀려고 한다.',like:'맛있는 음식, 여행 계획, 사진',dislike:'애매한 태도, 약속을 미루는 일',relation:'오래 알고 지낸 편한 사이. 가끔 직설적인 말로 서로를 당황하게 한다.',first:'오늘 같이 밥 먹을래? 할 얘기도 있고.'},
 {id:'kaede',name:'카에데',age:23,tag:'조용한 관찰자',trait:'관찰형',color:'#b4ad98',line:'#729579',initial:'楓',quote:'말보다 행동을 더 믿어요.',personality:'말수가 적고 신중하다. 친해지는 데 시간이 걸리지만 기억력이 좋다.',like:'독립 서점, 음악, 혼자 걷기',dislike:'시끄러운 자리, 억지스러운 친밀감',relation:'서로 잘 알지만 속마음을 깊이 나눈 적은 많지 않다.',first:'여기서 보니까 조금 낯설다.'},
 {id:'sohyun',name:'박소현',age:24,tag:'다정한 분위기 메이커',trait:'사교적',color:'#c9a69a',line:'#d58d9a',initial:'소',quote:'다 같이 편했으면 좋겠어요.',personality:'다정하고 사교적이다. 어색한 분위기를 자연스럽게 풀어 준다.',like:'보드게임, 디저트, 사람들과의 대화',dislike:'갈등을 오래 끄는 것',relation:'여러 참가자와 두루 친하다. 모임에서 중심 역할을 해 왔다.',first:'드디어 다 같이 모였네. 잘 지내보자.'},
 {id:'xinwei',name:'저우신위',age:24,tag:'자유로운 감각파',trait:'자유로움',color:'#8fa3a6',line:'#477d91',initial:'周',quote:'계획대로 되지 않는 게 재밌어요.',personality:'즉흥적이고 호기심이 많다. 새로운 경험을 좋아한다.',like:'전시, 낯선 동네, 라이브 음악',dislike:'지나친 간섭, 반복되는 일상',relation:'친구처럼 편하게 지내지만 예상하기 어려운 면이 있다.',first:'여기 분위기 생각보다 괜찮은데?'},
 {id:'hayeon',name:'정하연',age:25,tag:'신중한 감정파',trait:'신중함',color:'#a69fb4',line:'#9079a0',initial:'하',quote:'마음은 천천히 확인하고 싶어요.',personality:'감정이 깊고 신중하다. 쉽게 표현하지 않지만 한 번 마음을 열면 솔직하다.',like:'편지, 잔잔한 음악, 밤 산책',dislike:'재촉하는 질문, 가벼운 약속',relation:'가까운 듯 멀게 느껴지는 사이. 아직 나누지 못한 이야기가 있다.',first:'오늘은 어떤 하루가 될지 궁금하네요.'}
];
const schedules = [
 ['10:00','참가자 공동 아침 식사'],['14:00','첫인상 선택 및 준비'],['16:00','자유 시간 · 숙소 라운지'],['21:00','첫날의 메시지']
];
const chats = {
 jiwoo:[{from:'them',text:'오늘은 조금 늦게까지 깨어 있을 것 같아요.'},{from:'them',text:'여기서 다시 보니까 기분이 묘하네요.'}],
 yuryeon:[{from:'them',text:'오늘 같이 밥 먹을래? 할 얘기도 있고.'}],
 kaede:[{from:'them',text:'여기서 보니까 조금 낯설다.'}],
 sohyun:[{from:'them',text:'드디어 다 같이 모였네. 잘 지내보자.'}],
 xinwei:[{from:'them',text:'여기 분위기 생각보다 괜찮은데?'}],
 hayeon:[{from:'them',text:'오늘은 어떤 하루가 될지 궁금하네요.'}]
};
const choices = [
 {text:'나도 너랑 이야기하고 싶었어.',reply:'그렇게 말해줘서 다행이에요. 나중에 둘이 이야기해요.',score:3},
 {text:'여기 오니까 예전 생각이 나네.',reply:'그러게요. 그때랑은 조금 다른 기분이죠.',score:2},
 {text:'오늘은 다 같이 즐겁게 보내자.',reply:'좋아요. 오늘은 편하게 지내봐요.',score:1}
];
let state = JSON.parse(localStorage.getItem('ourSeasonState')||'null');
let currentTab='home', selectedPerson=null, activeChat=null, subpage=null;
const $=s=>document.querySelector(s);
function save(){localStorage.setItem('ourSeasonState',JSON.stringify(state))}
function person(id){return people.find(p=>p.id===id)}
function toast(msg){const t=$('#toast')||(()=>{let e=document.createElement('div');e.id='toast';e.className='toast';document.body.append(e);return e})();t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function start(){const name=$('#userName').value.trim(),age=Number($('#userAge').value);if(!name||age<18||age>99){toast('이름과 만 18세 이상의 나이를 입력해 주세요.');return}state={name,age,day:1,firstImpressions:[],messages:{},scores:{},letters:[],dateChoice:null,events:[]};people.forEach(p=>{state.messages[p.id]=[...(chats[p.id]||[])];state.scores[p.id]=0});save();$('#onboarding').classList.add('hidden');$('#mainApp').classList.remove('hidden');render()}
function init(){if(state){$('#onboarding').classList.add('hidden');$('#mainApp').classList.remove('hidden');render()}else{$('#onboarding').classList.remove('hidden');$('#mainApp').classList.add('hidden')}$('#enterBtn').addEventListener('click',start);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;selectedPerson=null;activeChat=null;render()}))}
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
function header(kicker,title,right=''){return `<div class="topline"><div class="smallcaps">${kicker}</div><div class="brand">OUR SEASON</div></div><div class="topline"><h2>${title}</h2><span class="muted" style="font:12px 'DM Sans'">${right}</span></div>`}
function routeSvg(){return `<svg viewBox="0 0 340 150" aria-hidden="true"><path d="M-10 30H70L110 65H190L235 25H350" fill="none" stroke="#477d91" stroke-width="4"/><path d="M-5 120H65L110 90H190L235 125H350" fill="none" stroke="#729579" stroke-width="4"/><path d="M55 -10L75 45L145 78L205 40L275 100L290 160" fill="none" stroke="#b74743" stroke-width="8"/><path d="M340 70H260L225 95H145L95 145H-5" fill="none" stroke="#d2b84c" stroke-width="3"/><g fill="#f5f0e7" stroke="#74695e" stroke-width="2"><circle cx="70" cy="30" r="5"/><circle cx="110" cy="65" r="5"/><circle cx="190" cy="65" r="5"/><circle cx="65" cy="120" r="5"/><circle cx="110" cy="90" r="5"/><circle cx="190" cy="90" r="5"/><circle cx="145" cy="78" r="6"/><circle cx="205" cy="40" r="5"/><circle cx="275" cy="100" r="5"/></g></svg>`}
function home(){let day=state.day;let titles=['첫 만남','조금씩 가까워지는 시간','마음의 방향','첫 데이트','중간 인터뷰','새로운 선택','익명의 편지','마지막 데이트','마지막 밤','최종 선택'];return `<div class="screen">${header('YOUR JOURNEY','HOME',`DAY ${String(day).padStart(2,'0')} / 10`)}<p class="subcopy">이미 알고 있던 사이에서 시작되는 열흘간의 감정 기록.</p><div class="hero"><div class="hero-image">${routeSvg()}</div><div class="hero-body"><span class="day-pill">DAY ${String(day).padStart(2,'0')}</span><h3>${titles[day-1]}</h3><p>${day===1?'익숙한 얼굴들과 다시 한 공간에 모였습니다. 오늘의 마음이 향하는 곳을 선택해 보세요.':'오늘의 일정과 참가자들의 새로운 이야기를 확인해 보세요.'}</p></div></div><div class="section-title"><span>TODAY'S SCHEDULE</span><span>01 — 04</span></div><div class="schedule">${schedules.map(x=>`<div class="schedule-row"><span class="time">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div><div class="section-title"><span>NOTICE</span><span>NEW</span></div><div class="notice">오늘 하루가 끝나기 전, 마음이 향하는 참가자에게 첫인상 메시지를 보내 보세요.</div><div class="day-control"><div><small class="smallcaps">YOUR SEASON</small><br><b>DAY ${String(day).padStart(2,'0')} / 10</b></div><button class="primary" onclick="advanceDay()">다음 날 진행 →</button></div></div>`}
function cast(){return `<div class="screen">${header('MEET THE HOUSEMATES','CAST','6 PARTICIPANTS')}<p class="subcopy">사용자를 제외한 참가자 6명. 모두 프로그램 시작 전부터 서로 알고 지낸 사이입니다.</p><div class="cast-grid">${people.map(p=>`<button class="cast-card" onclick="openProfile('${p.id}')"><div class="cast-photo" style="background:linear-gradient(135deg,${p.color},${p.color}bb)"><span class="tag">${p.tag}</span><span class="initial">${p.initial}</span></div><div class="cast-info"><div class="cast-name">${p.name}</div><div class="cast-meta">${p.age}세 · ${p.trait}</div></div></button>`).join('')}</div></div>`}
function openProfile(id){selectedPerson=id;render()}
function profile(){let p=person(selectedPerson);return `<div class="screen"><button class="back" onclick="selectedPerson=null;render()">← CAST로 돌아가기</button><div class="profile-cover" style="background:linear-gradient(135deg,${p.color},${p.color}bb)"><span class="initial">${p.initial}</span></div><div class="smallcaps">PARTICIPANT PROFILE · LINE ${people.indexOf(p)+1}</div><h2 class="profile-name">${p.name} <span style="font-size:14px;font-weight:400">${p.age}세</span></h2><p class="profile-quote">“${p.quote}”</p><div class="info-list"><div class="info-row"><b>성격</b>${p.personality}</div><div class="info-row"><b>좋아하는 것</b>${p.like}</div><div class="info-row"><b>싫어하는 것</b>${p.dislike}</div><div class="info-row"><b>우리의 관계</b>${p.relation}</div></div><button class="primary wide" style="margin-top:16px" onclick="openChat('${p.id}')">메시지 보내기 →</button></div>`}
function chat(){if(activeChat)return chatRoom();return `<div class="screen">${header('KEEP IN TOUCH','CHAT','MESSAGES')}<p class="subcopy">참가자들과 나눈 대화를 확인할 수 있습니다.</p><div class="chat-list">${people.map(p=>{let msgs=state.messages[p.id]||[];let last=msgs[msgs.length-1]?.text||'대화를 시작해 보세요.';return `<button class="chat-person" onclick="openChat('${p.id}')"><div class="avatar" style="background:${p.color}">${p.initial}</div><div class="chat-main"><b>${p.name}</b><p>${last}</p></div><span class="chat-time">21:${String(10+people.indexOf(p)*5).padStart(2,'0')}</span></button>`}).join('')}</div></div>`}
function openChat(id){activeChat=id;currentTab='chat';render()}
function chatRoom(){let p=person(activeChat),msgs=state.messages[activeChat]||[];return `<div class="screen"><div class="chat-head"><button class="back" onclick="activeChat=null;render()">←</button><div class="avatar" style="background:${p.color}">${p.initial}</div><b>${p.name}</b></div><div class="chat-messages">${msgs.map(m=>`<div class="bubble ${m.from==='me'?'mine':'theirs'}">${m.text}</div>`).join('')}</div><div class="smallcaps">REPLY</div><div class="choice-list">${choices.map((c,i)=>`<button class="choice" onclick="reply(${i})">${c.text}</button>`).join('')}</div></div>`}
function reply(i){let p=person(activeChat),c=choices[i];state.messages[activeChat].push({from:'me',text:c.text},{from:'them',text:c.reply});state.scores[activeChat]=(state.scores[activeChat]||0)+c.score;save();render()}
function date(){return `<div class="screen">${header('A MOMENT TOGETHER','DATE','DAY '+String(state.day).padStart(2,'0'))}<p class="subcopy">오늘 함께 시간을 보내고 싶은 참가자를 선택해 데이트 초대장을 확인하세요.</p><div class="ticket"><div class="ticket-top"><span>DATE TICKET · OUR SEASON</span><span>DAY ${String(state.day).padStart(2,'0')}</span></div><h3>${state.dateChoice?person(state.dateChoice).name:'TO SOMEONE'}</h3><p>오늘의 목적지는 아직 정해지지 않았습니다.</p><div class="ticket-data">DATE INFO<br>▦　DAY ${String(state.day).padStart(2,'0')}<br>⌖　한강공원<br>◷　16:00</div></div><div class="section-title"><span>CHOOSE YOUR DATE</span><span>6 HOUSEMATES</span></div><div class="chat-list">${people.map(p=>`<button class="chat-person" onclick="chooseDate('${p.id}')"><div class="avatar" style="background:${p.color}">${p.initial}</div><div class="chat-main"><b>${p.name}</b><p>${p.tag}</p></div><span>→</span></button>`).join('')}</div>${state.dateChoice?`<div class="button-row" style="margin-top:13px"><button class="primary" onclick="toast('${person(state.dateChoice).name}에게 데이트를 신청했습니다.')">초대하기</button><button class="secondary" onclick="state.dateChoice=null;save();render()">취소</button></div>`:''}</div>`}
function chooseDate(id){state.dateChoice=id;save();render()}
function mapScreen(){subpage='map';render()}
function mapView(){return `<div class="screen"><button class="back" onclick="subpage=null;render()">← MY로 돌아가기</button>${header('THE CONNECTIONS','RELATIONSHIP','DAY '+String(state.day).padStart(2,'0'))}<p class="subcopy">열흘 동안 쌓이는 관계를 노선도로 기록합니다.</p><div class="map-card"><svg viewBox="0 0 340 300"><path d="M10 40H80L110 75H210L250 40H330" fill="none" stroke="#477d91" stroke-width="4"/><path d="M0 250H70L110 205H200L260 245H340" fill="none" stroke="#729579" stroke-width="4"/><path d="M60 0L80 65L145 120L200 80L270 160L290 300" fill="none" stroke="#b74743" stroke-width="8"/><path d="M340 100H265L230 140H145L90 220H0" fill="none" stroke="#d2b84c" stroke-width="4"/><path d="M0 160H65L100 130H165L205 180H340" fill="none" stroke="#9079a0" stroke-width="4"/><g fill="#f5f0e7" stroke="#62574d" stroke-width="2"><circle cx="80" cy="40" r="6"/><circle cx="110" cy="75" r="6"/><circle cx="210" cy="75" r="6"/><circle cx="70" cy="250" r="6"/><circle cx="110" cy="205" r="6"/><circle cx="200" cy="205" r="6"/><circle cx="145" cy="120" r="7"/><circle cx="200" cy="80" r="6"/><circle cx="270" cy="160" r="6"/></g><text x="145" y="145" font-size="10" fill="#8e3833" text-anchor="middle">OUR SEASON</text></svg><div class="map-legend">${people.map((p,i)=>`<div class="legend-item"><span class="dot" style="background:${p.line}"></span>${p.name} <span class="muted">LINE ${i+1}</span></div>`).join('')}</div></div><div class="notice">관계 노선도는 프로그램 진행에 따라 새로운 사건과 교차 지점이 추가됩니다.</div></div>`}
function letters(){subpage='letters';render()}
function lettersView(){return `<div class="screen"><button class="back" onclick="subpage=null;render()">← MY로 돌아가기</button>${header('WORDS FROM SOMEONE','LETTER','ANONYMOUS')}<p class="subcopy">누군가 당신에게 남긴 마음을 확인해 보세요.</p><div class="letter"><div class="smallcaps" style="text-align:center">A LETTER FOR YOU</div><h3>익명의 편지</h3><p>누군가 당신에게<br>마음을 전했습니다.<br><br>아직 누구의 편지인지는 알 수 없습니다.</p><button class="primary wide" onclick="openLetter()">편지 열어보기</button></div><div class="section-title"><span>MY LETTER BOX</span><span>${state.letters.length} RECEIVED</span></div><div class="menu-list"><button class="menu-row" onclick="openLetter()">도착한 편지 확인하기 <span>→</span></button></div></div>`}
function openLetter(){toast('아직 도착한 편지가 없습니다. DAY 07에 다시 확인해 주세요.')}
function my(){return `<div class="screen">${header('YOUR ARCHIVE','MY','PROFILE')}<div class="menu-list"><div class="chat-person"><div class="avatar" style="background:#a93632">나</div><div class="chat-main"><b>${state.name}</b><p>${state.age}세 · OUR SEASON 참가자</p></div></div><button class="menu-row" onclick="letters()">✉　받은 편지함 <span>→</span></button><button class="menu-row" onclick="toast('데이트 기록이 아직 없습니다.')">▤　나의 기록 <span>→</span></button><button class="menu-row" onclick="mapScreen()">◎　관계 노선도 <span>→</span></button><button class="menu-row" onclick="resetGame()">⚙　처음부터 다시 시작 <span>→</span></button></div><div class="ticket" style="text-align:center"><div class="ticket-top"><span>OUR SEASON</span><span>PERSONAL ARCHIVE</span></div><h3>DAY ${String(state.day).padStart(2,'0')} / 10</h3><p>당신의 열흘이 기록되고 있습니다.</p></div></div>`}
function resetGame(){if(confirm('모든 진행 기록을 삭제하고 처음부터 시작할까요?')){localStorage.removeItem('ourSeasonState');state=null;currentTab='home';init()}}
function advanceDay(){if(state.day>=10){toast('최종 선택까지 도달했습니다.');return}state.day++;save();render();toast(`DAY ${String(state.day).padStart(2,'0')}가 시작되었습니다.`)}
function render(){nav();let html;if(subpage==='map')html=mapView();else if(subpage==='letters')html=lettersView();else if(selectedPerson)html=profile();else if(currentTab==='home')html=home();else if(currentTab==='cast')html=cast();else if(currentTab==='chat')html=chat();else if(currentTab==='date')html=date();else if(currentTab==='my')html=my();$('#screen').innerHTML=html}
init();
  </script>
</body>
</html>
