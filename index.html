<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딸기공주채원이의 두쫀쿠는 어디로 갔을까?</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>

:root{
 --bg:#fff0f5;--paper:#fffafd;--white:#fff;--berry:#df5e8c;--berry-dark:#a93d69;
 --pink:#f7b8ce;--pink-soft:#ffe0ea;--cream:#fff8ee;--ink:#684253;
 --muted:#a7798c;--green:#9eae86;--shadow:#f1bfd0;
 color-scheme:light
}
*{box-sizing:border-box}
html{min-height:100%;background:#ffe8f0}
body{margin:0;min-height:100svh;background:
 radial-gradient(circle at 8% 10%,rgba(255,255,255,.85) 0 3px,transparent 4px),
 radial-gradient(circle at 91% 17%,rgba(255,255,255,.8) 0 2px,transparent 3px),
 linear-gradient(145deg,#ffeaf1,#fff5f7 55%,#ffe5ee);
 color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.55;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)
}
button{font:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
button:focus-visible{outline:3px solid #d84f84;outline-offset:3px}
#app{width:min(100%,980px);min-height:100svh;margin:0 auto;padding:clamp(12px,2.6vw,28px)}
h1{font-size:clamp(1.45rem,4vw,2rem);line-height:1.25;color:var(--berry);margin:.15em 0 .45em}
h2{font-size:1.15rem;color:var(--berry-dark);margin:1.2em 0 .45em}
p{margin:.4em 0}
/* title screen: separate character, title typography, decorations and button */
.intro-shell{
 min-height:calc(100svh - 56px);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.92fr);
 align-items:center;gap:clamp(14px,3vw,42px);position:relative;overflow:hidden;
 padding:clamp(18px,3vw,38px);border:4px solid #fff;border-radius:34px;
 background:
  repeating-linear-gradient(0deg,rgba(244,174,198,.10) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgba(244,174,198,.10) 0 1px,transparent 1px 28px),
  linear-gradient(145deg,#fff4f7,#ffe5ee);
 box-shadow:0 9px 0 var(--shadow),0 20px 48px rgba(171,78,116,.12)
}
.intro-shell:before,.intro-shell:after{position:absolute;pointer-events:none;color:#ef9db9;opacity:.8;font-size:clamp(25px,4vw,44px)}
.intro-shell:before{content:"✦";top:5%;left:4%}
.intro-shell:after{content:"♡";right:4%;bottom:6%}
.intro-character{height:min(78svh,700px);min-height:390px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.intro-character-frame{
 height:100%;width:100%;max-width:440px;display:flex;align-items:flex-end;justify-content:center;
 border:5px solid #fff;border-radius:48% 48% 28px 28px;
 background:linear-gradient(180deg,#f9c8d9,#fff0f5);overflow:hidden;
 box-shadow:0 7px 0 #f2bfd0,0 15px 30px rgba(172,77,116,.13);position:relative
}
.intro-character-frame:before{content:"";position:absolute;inset:12px;border:2px dashed rgba(255,255,255,.8);border-radius:48% 48% 20px 20px;z-index:1;pointer-events:none}
.intro-character img{width:100%;height:100%;object-fit:contain;object-position:center bottom;image-rendering:pixelated;display:block}
.intro-copy{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);padding:18px 8px}
.intro-bow{font-size:clamp(36px,5vw,58px);line-height:1;color:#d95b89;text-shadow:2px 3px 0 #fff}
.intro-kicker{display:inline-block;padding:8px 22px;border:2px solid #f4a9c2;border-radius:999px;background:#fff;color:#a94770;font-size:clamp(12px,1.5vw,16px);font-weight:900;box-shadow:0 3px 0 #f6d1dd}
.intro-title{margin:0;color:#d84e83;font-size:clamp(34px,5vw,60px);font-weight:950;letter-spacing:-2px;line-height:1.13;text-shadow:2px 3px 0 #fff,4px 5px 0 #f2b2c9}
.intro-title span{display:block}
.intro-subtitle{font-size:clamp(10px,1.4vw,14px);letter-spacing:2px;font-weight:900;color:#b45c7d}
.intro-description{font-size:clamp(12px,1.5vw,15px);line-height:1.8;color:#916176;margin:0}
.start-game{
 min-width:min(280px,90%);border:3px solid #fff;border-radius:20px;padding:15px 28px;
 background:linear-gradient(180deg,#f58db2,#df5c90);color:#fff;font-size:clamp(17px,2vw,22px);
 font-weight:950;box-shadow:0 6px 0 #b74775,0 12px 22px rgba(177,68,112,.18);
 text-shadow:1px 2px 0 rgba(145,42,84,.25)
}
.start-game:active{transform:translateY(4px);box-shadow:0 2px 0 #b74775}
.intro-foot{font-size:10px;letter-spacing:2px;color:#bf8198}
.intro-sticker{position:absolute;font-size:clamp(24px,3vw,36px);z-index:2;filter:drop-shadow(0 3px 0 #fff)}
.sticker-one{left:5%;bottom:8%}.sticker-two{right:6%;top:9%}
/* game lobby and content */
.game-shell{max-width:760px;margin:0 auto}
.game-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 15px}
.game-brand{font-size:13px;font-weight:950;letter-spacing:1.4px;color:var(--berry-dark)}
.case-pill{background:#fff;border:1px solid #f3c0d1;border-radius:999px;padding:6px 12px;color:#a85a78;font-size:11px;font-weight:900;white-space:nowrap}
.game-banner{background:linear-gradient(135deg,#fff,#fff1f5);border:3px solid #fff;border-radius:24px;padding:20px;margin-bottom:15px;box-shadow:0 5px 0 #f4c7d5;position:relative;overflow:hidden}
.game-banner:after{content:"🍓";position:absolute;right:14px;top:12px;font-size:30px;opacity:.85}
.game-banner h1{font-size:clamp(20px,4vw,27px);margin:0 40px 6px 0}
.game-banner p{font-size:13px;color:#8d6174;margin:0}
.game-menu-label{font-size:14px;font-weight:950;color:#9e4d6e;margin:20px 4px 10px}
.game-menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.game-menu-card{min-height:105px;border:2px solid #fff;border-radius:19px;background:rgba(255,255,255,.9);color:#a64e70;box-shadow:0 4px 0 #f2c4d2;padding:12px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.game-menu-card:active{transform:translateY(3px);box-shadow:0 1px 0 #f2c4d2}
.game-menu-card .ico{font-size:27px;line-height:1}
.game-menu-card .lbl{font-size:12px;font-weight:900}
.card{background:var(--paper);border:2px solid #fff;border-radius:19px;padding:14px 16px;margin:10px 0;box-shadow:0 4px 0 #f4c9d6}
button{border:2px solid #efadc3;background:#fffafd;color:#a94770;border-radius:999px;padding:8px 15px;margin:4px 4px 4px 0;font-weight:800}
button:hover,button:focus-visible{background:#fce0e9;color:#96395f;outline-offset:2px}
button.main{background:linear-gradient(180deg,#f18bb0,#dc5b8d);color:#fff;border:2px solid #fff;box-shadow:0 4px 0 #b84a77;font-size:1.05rem;padding:11px 23px}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:7px;position:sticky;top:0;background:rgba(255,239,245,.94);backdrop-filter:blur(8px);padding:10px 0;z-index:2;flex-wrap:nowrap;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;margin:0;padding:9px 12px;font-size:13px;border-radius:14px}
.tabs button.on{background:#e96f9b;color:#fff;border-color:#e96f9b;box-shadow:0 3px 0 #c75b83}
.say{border-left:4px solid #e98aae;padding:10px 12px;margin:8px 0;background:#fff3f7;border-radius:0 12px 12px 0;color:#7e4c62}
.clue{border-left:4px solid #9eae86;padding:10px 12px;margin:8px 0;background:#f7f8ef;border-radius:0 12px 12px 0;color:#6f735d}
.cookie{font-size:3.5rem;text-align:center;margin:.2em 0}
.found{opacity:.65}
small{color:#a47a8b}
h2{border-bottom:1px dashed #edb5c8;padding-bottom:7px}
@media(max-width:680px){
 #app{padding:10px}
 .intro-shell{min-height:calc(100svh - 20px);grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:0;padding:12px 14px 18px;border-radius:25px}
 .intro-character{grid-row:1;min-height:0;height:100%;max-height:48svh}
 .intro-character-frame{width:min(76%,340px);max-width:340px;border-radius:48% 48% 24px 24px}
 .intro-copy{grid-row:2;padding:8px 4px 4px;gap:8px}
 .intro-title{font-size:clamp(29px,8.2vw,42px)}
 .intro-kicker{font-size:12px;padding:6px 17px}
 .intro-description{font-size:11px;line-height:1.55}
 .intro-bow{font-size:30px}
 .start-game{padding:11px 20px;min-width:220px;font-size:17px}
 .intro-foot{font-size:9px}
 .sticker-one{left:3%;bottom:35%}.sticker-two{right:3%;top:5%}
 .game-menu-grid{gap:8px}
 .game-menu-card{min-height:92px}
 .game-menu-card .ico{font-size:24px}
 .game-menu-card .lbl{font-size:11px}
 .tabs button{font-size:12px;padding:8px 10px}
}
@media(max-width:390px){
 .intro-character{max-height:43svh}
 .intro-character-frame{width:70%}
 .intro-title{font-size:27px}
 .intro-description{display:none}
 .game-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:681px){
 #app{padding:22px}
 .game-shell{padding:12px 16px 38px}
}

</style>
</head>

<main id="app"></main>
