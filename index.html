 {text:'나도 너랑 이야기하고 싶었어.',reply:'그렇게 말해줘서 다행이에요. 나중에 둘이 이야기해요.',score:3},
 {text:'여기 오니까 예전 생각이 나네.',reply:'그러게요. 그때랑은 조금 다른 기분이죠.',score:2},
 {text:'오늘은 다 같이 즐겁게 보내자.',reply:'좋아요. 오늘은 편하게 지내봐요.',score:1}
];
let state = JSON.parse(localStorage.getItem('ourSeasonState')||'null');
let currentTab='home', selectedPerson=null, activeChat=null, subpage=null;
const $=s=>document.querySelector(s);
function save(){localStorage.setItem('ourSeasonState',JSON.stringify(state))}
function person(id){return people.find(p=>p.id===id)}
function toast(msg){const t=$('#toast')||(()=>{let e=document.createElement('div');e.id='toast';e.className='toast';document.body.append(e);return e})();t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function start(){const name=$('#userName').value.trim(),age=Number($('#userAge').value);if(!name||age<18||age>99){toast('이름과 만 18세 이상의 나이를 입력해 주세요.');return}state={name,age,day:1,firstImpressions:[],messages:{},scores:{},letters:[],dateChoice:null,events:[]};people.forEach(p=>{state.messages[p.id]=[...(chats[p.id]||[])];state.scores[p.id]=0});save();$('#onboarding').classList.add('hidden');$('#mainApp').classList.remove('hidden');render()}
function init(){if(state){$('#onboarding').classList.add('hidden');$('#mainApp').classList.remove('hidden');render()}else{$('#onboarding').classList.remove('hidden');$('#mainApp').classList.add('hidden')}$('#enterBtn').addEventListener('click',start);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;selectedPerson=null;activeChat=null;render()}))}
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
function header(kicker,title,right=''){return `<div class="topline"><div class="smallcaps">${kicker}</div><div class="brand">OUR SEASON</div></div><div class="topline"><h2>${title}</h2><span class="muted" style="font:12px 'DM Sans'">${right}</span></div>`}
function routeSvg(){return `<svg viewBox="0 0 340 150" aria-hidden="true"><path d="M-10 30H70L110 65H190L235 25H350" fill="none" stroke="#477d91" stroke-width="4"/><path d="M-5 120H65L110 90H190L235 125H350" fill="none" stroke="#729579" stroke-width="4"/><path d="M55 -10L75 45L145 78L205 40L275 100L290 160" fill="none" stroke="#b74743" stroke-width="8"/><path d="M340 70H260L225 95H145L95 145H-5" fill="none" stroke="#d2b84c" stroke-width="3"/><g fill="#f5f0e7" stroke="#74695e" stroke-width="2"><circle cx="70" cy="30" r="5"/><circle cx="110" cy="65" r="5"/><circle cx="190" cy="65" r="5"/><circle cx="65" cy="120" r="5"/><circle cx="110" cy="90" r="5"/><circle cx="190" cy="90" r="5"/><circle cx="145" cy="78" r="6"/><circle cx="205" cy="40" r="5"/><circle cx="275" cy="100" r="5"/></g></svg>`}
function home(){let day=state.day;let titles=['첫 만남','조금씩 가까워지는 시간','마음의 방향','첫 데이트','중간 인터뷰','새로운 선택','익명의 편지','마지막 데이트','마지막 밤','최종 선택'];return `<div class="screen">${header('YOUR JOURNEY','HOME',`DAY ${String(day).padStart(2,'0')} / 10`)}<p class="subcopy">이미 알고 있던 사이에서 시작되는 열흘간의 감정 기록.</p><div class="hero"><div class="hero-image">${routeSvg()}</div><div class="hero-body"><span class="day-pill">DAY ${String(day).padStart(2,'0')}</span><h3>${titles[day-1]}</h3><p>${day===1?'익숙한 얼굴들과 다시 한 공간에 모였습니다. 오늘의 마음이 향하는 곳을 선택해 보세요.':'오늘의 일정과 참가자들의 새로운 이야기를 확인해 보세요.'}</p></div></div><div class="section-title"><span>TODAY'S SCHEDULE</span><span>01 — 04</span></div><div class="schedule">${schedules.map(x=>`<div class="schedule-row"><span class="time">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div><div class="section-title"><span>NOTICE</span><span>NEW</span></div><div class="notice">오늘 하루가 끝나기 전, 마음이 향하는 참가자에게 첫인상 메시지를 보내 보세요.</div><div class="day-control"><div><small class="smallcaps">YOUR SEASON</small><br><b>DAY ${String(day).padStart(2,'0')} / 10</b></div><button class="primary" onclick="advanceDay()">다음 날 진행 →</button></div></div>`}
function cast(){return `<div class="screen">${header('MEET THE HOUSEMATES','CAST','6 PARTICIPANTS')}<p class="subcopy">사용자를 제외한 참가자 6명. 모두 프로그램 시작 전부터 서로 알고 지낸 사이입니다.</p><div class="cast-grid">${people.map(p=>`<button class="cast-card" onclick="openProfile('${p.id}')"><div class="cast-photo" style="background:linear-gradient(135deg,${p.color},${p.color}bb)"><span class="tag">${p.tag}</span><span class="initial">${p.initial}</span></div><div class="cast-info"><div class="cast-name">${p.name}</div><div class="cast-meta">${p.age}세 · ${p.trait}</div></div></button>`).join('')}</div></div>`}

function profile(){let p=person(selectedPerson);return `<div class="screen"><button class="back" onclick="selectedPerson=null;render()">← CAST로 돌아가기</button><div class="profile-cover" style="background:linear-gradient(135deg,${p.color},${p.color}bb)"><span class="initial">${p.initial}</span></div><div class="smallcaps">PARTICIPANT PROFILE · LINE ${people.indexOf(p)+1}</div><h2 class="profile-name">${p.name} <span style="font-size:14px;font-weight:400">${p.age}세</span></h2><p class="profile-quote">“${p.quote}”</p><div class="info-list"><div class="info-row"><b>성격</b>${p.personality}</div><div class="info-row"><b>좋아하는 것</b>${p.like}</div><div class="info-row"><b>싫어하는 것</b>${p.dislike}</div><div class="info-row"><b>우리의 관계</b>${p.relation}</div></div><button class="primary wide" style="margin-top:16px" onclick="openChat('${p.id}')">메시지 보내기 →</button></div>`}
function chat(){if(activeChat)return chatRoom();return `<div class="screen">${header('KEEP IN TOUCH','CHAT','MESSAGES')}<p class="subcopy">참가자들과 나눈 대화를 확인할 수 있습니다.</p><div class="chat-list">${people.map(p=>{let msgs=state.messages[p.id]||[];let last=msgs[msgs.length-1]?.text||'대화를 시작해 보세요.';return `<button class="chat-person" onclick="openChat('${p.id}')"><div class="avatar" style="background:${p.color}">${p.initial}</div><div class="chat-main"><b>${p.name}</b><p>${last}</p></div><span class="chat-time">21:${String(10+people.indexOf(p)*5).padStart(2,'0')}</span></button>`}).join('')}</div></div>`}

function chatRoom(){let p=person(activeChat),msgs=state.messages[activeChat]||[];return `<div class="screen"><div class="chat-head"><button class="back" onclick="activeChat=null;render()">←</button><div class="avatar" style="background:${p.color}">${p.initial}</div><b>${p.name}</b></div><div class="chat-messages">${msgs.map(m=>`<div class="bubble ${m.from==='me'?'mine':'theirs'}">${m.text}</div>`).join('')}</div><div class="smallcaps">REPLY</div><div class="choice-list">${choices.map((c,i)=>`<button class="choice" onclick="reply(${i})">${c.text}</button>`).join('')}</div></div>`}
function reply(i){let p=person(activeChat),c=choices[i];state.messages[activeChat].push({from:'me',text:c.text},{from:'them',text:c.reply});state.scores[activeChat]=(state.scores[activeChat]||0)+c.score;save();render()}
